[package]
name = "hygiene"
version = "0.4.1"
edition = "2021"
rust-version = "1.70"
description = "Interactive cleaner for Windows + WSL dev machines: caches, temp, logs, crash dumps, plus Docker/WSL disk compaction. Zero dependencies."
license = "MIT"
repository = "https://github.com/srshah207/hygiene"
readme = "README.md"
keywords = ["cleaner", "windows", "wsl", "disk-space", "cli"]
categories = ["command-line-utilities", "filesystem"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
