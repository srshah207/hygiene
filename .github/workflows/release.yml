name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must match Cargo.toml version)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version v$version"
            exit 1
          fi
      - name: Build
        run: cargo build --release
      - name: Package + checksum
        shell: pwsh
        run: |
          Copy-Item target/release/hygiene.exe hygiene-windows-x86_64.exe
          $hash = (Get-FileHash hygiene-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  hygiene-windows-x86_64.exe" | Out-File hygiene-windows-x86_64.exe.sha256 -Encoding ascii
      - name: Smoke test packaged binary
        run: ./hygiene-windows-x86_64.exe --version
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            hygiene-windows-x86_64.exe
            hygiene-windows-x86_64.exe.sha256
          generate_release_notes: true
