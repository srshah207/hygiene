<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:

  }
  .grid {

    font-weight: 600; font-size: 92px; letter-spacing: -3px; color: #F8FAFC;
  }
  .tag {
    font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 32px; color: #94A3B8; letter-spacing: -0.3px;
  }
  .url {
    position: absolute; right: 44px; bottom: 34px;
    font-family: Consolas, 'Cascadia Mono', monospace;
    font-size: 21px; font-weight: 500; color: #94A3B8; letter-spacing: 0.5px;
  }
  .mark { margin-bottom: 2px; }
</style></head>
